<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Istana Megah Untuk Dian 💛</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Megah & Estetik -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Playfair+Display:ital,wght@0,700;1,600&family=Parisienne&display=swap" rel="stylesheet">
</head>
<body>

    <!-- MUSIK ROMANTIS (Pastikan nama file di folder sama dengan src di bawah) -->
    <audio id="bgMusic" loop>
        <source src="everything-you-are.mp3" type="audio/mpeg">
    </audio>

    <!-- LAYER 1: GERBANG ISTANA NAILONG -->
    <div id="palaceGate" class="gate-wrapper">
        <div class="gate-left"></div>
        <div class="gate-right"></div>
        
        <div class="login-card">
            <img src="https://media1.tenor.com/m/9n9G0t0Oq9AAAAAd/nailong-cute.gif" alt="Nailong Kunci" class="royal-nailong">
            <h1 class="palace-title">Istana Memori</h1>
            <p class="subtitle">Kunci gerbang ini dengan namamu di hatiku.</p>
            
            <input type="password" id="password" placeholder="Masukkan Sandi Rahasia...">
            <button onclick="bukaGerbang()" class="btn-royal">Buka Istana ✨</button>
            <p id="errorMsg" class="error hidden">Itu bukan sandi kita, Sayang! Coba lagi.</p>
        </div>
    </div>

    <!-- LAYER 2: RUANG UTAMA ISTANA -->
    <div id="mainPalace" class="main-palace hidden">
        
        <!-- Hiasan Nailong Terbang di Latar Belakang -->
        <img src="https://media.tenor.com/tHqgU_vAEEwAAAAi/nailong-cute.gif" class="flying-nailong" style="top: 10%; left: 5%; animation-duration: 4s;">
        <img src="https://media1.tenor.com/m/O6rE5G9a5b0AAAAd/nailong-love.gif" class="flying-nailong" style="top: 20%; right: 5%; animation-duration: 5s;">
        
        <div class="palace-content">
            <!-- Header Megah -->
            <div class="header-section">
                <h2 class="parisienne accent-text">Selamat Ulang Tahun yang ke-21,</h2>
                <h1 class="playfair giant-title">Dian Sri Mentari</h1>
                <div class="royal-divider">
                    <span>✨</span>💛<span>✨</span>
                </div>
            </div>

            <!-- Jam Hitung Mundur -->
            <div class="countdown-palace">
                <div class="time-box"><span id="days">00</span><p>Hari</p></div>
                <div class="time-box"><span id="hours">00</span><p>Jam</p></div>
                <div class="time-box"><span id="mins">00</span><p>Menit</p></div>
                <div class="time-box"><span id="secs">00</span><p>Detik</p></div>
            </div>

            <!-- Galeri Lukisan Istana -->
            <h3 class="playfair section-title">Koleksi Senyum Terindahmu</h3>
            <div class="gallery-palace">
                <div class="frame-royal" onclick="bukaFoto('https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=800', 'Kamu adalah ratu di hatiku 🥰')">
                    <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?w=400" alt="Foto Dian 1">
                    <div class="frame-overlay">Sentuh Aku ✨</div>
                </div>
                <div class="frame-royal" onclick="bukaFoto('https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=800', 'Bersamamu adalah keajaiban 💛')">
                    <img src="https://images.unsplash.com/photo-1522673607200-164d1b6ce486?w=400" alt="Foto Berdua">
                    <div class="frame-overlay">Sentuh Aku ✨</div>
                </div>
                <div class="frame-royal" onclick="bukaFoto('https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=800', 'Selamanya kamu milikku 💍')">
                    <img src="https://images.unsplash.com/photo-1494774157365-9e04c6720e47?w=400" alt="Foto Memori">
                    <div class="frame-overlay">Sentuh Aku ✨</div>
                </div>
            </div>

            <!-- Bagian Surat Cinta Gulung -->
            <div class="scroll-section">
                <button id="btnBacaSurat" class="btn-royal-large" onclick="bacaTitah()">Baca Surat Spesialku 💌</button>
                
                <div id="royalScroll" class="scroll-container hidden">
                    <div class="scroll-paper">
                        <img src="https://media1.tenor.com/m/O6rE5G9a5b0AAAAd/nailong-love.gif" alt="Nailong Surat" class="nailong-seal">
                        <h2 class="parisienne accent-text" style="font-size:3.5rem; margin-bottom: 20px;">Teruntuk Permaisuriku,</h2>
                        <p id="typedText" class="surat-text"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL FOTO ANIMASI HATI -->
    <div id="photoModal" class="photo-modal">
        <span class="close-modal" onclick="tutupFoto()">✖</span>
        <div class="modal-content">
            <img id="modalImg" src="">
            <h2 id="modalCaption" class="parisienne"></h2>
            <div id="heartExplosion"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
