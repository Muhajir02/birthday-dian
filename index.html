<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Dian 💖</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- INTRO -->
<div id="intro">
  <h1>💖 Special For You 💖</h1>
  <button onclick="enterSite()">Masuk</button>
</div>

<!-- PASSWORD -->
<div id="lock" class="hidden">
  <h2>Masukkan Password 💌</h2>
  <input type="password" id="pass" placeholder="Hint: tanggal spesial 😉">
  <br><br>
  <button onclick="checkPass()">Buka</button>
</div>

<!-- MAIN -->
<div id="main" class="hidden">

<audio id="music" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_c8f3a4c1a5.mp3">
</audio>

<div class="hearts"></div>

<h1>🎂 Happy Birthday 🎂</h1>
<h2>Dian Sri Mentari 💖</h2>

<p id="countdown"></p>

<img src="https://i.pinimg.com/originals/9f/5c/6a/9f5c6a1f9c1e7c9c5e4d9c9c6a6f6f6f.gif" class="nailong">

<!-- SLIDESHOW -->
<div class="slider">
  <img id="slide" src="">
</div>

<button onclick="startLove()">💌 Buka Pesan Aku</button>

<p id="text"></p>

<canvas id="confetti"></canvas>

</div>

<script src="script.js"></script>
</body>
</html>
